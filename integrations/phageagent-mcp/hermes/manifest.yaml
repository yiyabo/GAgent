# Draft entry for NousResearch/hermes-agent optional-mcps/phageagent/manifest.yaml.
# Not submitted. Validated locally with hermes_cli.mcp_catalog.
manifest_version: 1

name: phageagent
description: >-
  PhageAgent MCP: read-only PhageScope phage database: 2.58M phages, 131M proteins and
  12.6M protein families, with provenance on every result.
source: https://github.com/yiyabo/phageagent-mcp

# Vendor-hosted remote MCP (Streamable HTTP). Personal bearer token.
transport:
  type: http
  url: https://phageagent.deepomics.org/mcp

auth:
  type: api_key
  env:
    - name: MCP_PHAGEAGENT_API_KEY
      prompt: PhageAgent MCP token (gpsk_...)
      secret: true

suggest:
  keywords:
    - phage
    - bacteriophage
    - phagescope
    - phageagent
  hosts:
    - phageagent.deepomics.org

post_install: |
  Sign in at https://phageagent.deepomics.org, open Extensions > External
  access, create a token, then restart the session so tools load.
