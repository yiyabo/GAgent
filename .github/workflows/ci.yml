name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run backend contract and execution regressions
        run: >-
          python -m pytest app/tests/unit app/tests/chat app/tests/plan app/tests/artifacts
          app/tests/tools/test_task_verification.py
          app/tests/tools/test_async_tool_executor.py
          app/tests/tools/test_execute_code_cancellation.py
          app/tests/tools/test_execute_code_rpc.py
          app/tests/tools/test_delegation_cancellation.py
          app/tests/integration/test_chat_message_pipeline.py
          app/tests/integration/test_real_app_chat_sessions.py
          app/tests/integration/test_skill_learning_api.py
          -q -m "not external"

  frontend-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - name: Check TypeScript
        run: npm run type-check
      - name: Run frontend regressions
        run: npm run test -- --run
