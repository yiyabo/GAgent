name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install dependencies
        run: |
          python -m pip install uv==0.7.12
          uv sync --frozen --no-dev --python ${{ matrix.python-version }}

      - name: Use the same offline tokenizer vocabulary as the app image
        run: echo "TIKTOKEN_CACHE_DIR=${GITHUB_WORKSPACE}/deploy/tiktoken-cache" >> "$GITHUB_ENV"

      - name: Run backend contract and execution regressions
        run: >-
          uv run --frozen --no-dev --python ${{ matrix.python-version }} python -m pytest app/tests -q -m "not external"

  frontend-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - name: Check TypeScript
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Run frontend regressions
        run: npm run test -- --run

  # ---------------------------------------------------------------------------
  # P6 (LOCAL_INFRA §126): build the stack images and prove the real stack on
  # the runner. This job boots the same compose file production uses and runs
  # the same §8.2 verification script the host deploy uses (p1-verify.sh),
  # plus a smoke of the P4 ops service. Push-to-main and manual dispatch only:
  # the sandbox image build (job below) is heavy and PRs keep the fast jobs.
  # ---------------------------------------------------------------------------
  stack-verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Build frontend dist (empty API origins, no :9000 leakage)
        working-directory: web-ui
        run: |
          npm ci
          VITE_API_BASE_URL='' VITE_WS_BASE_URL='' npm run build
          hits=$(grep -rl --include='*.js' ":9000" dist 2>/dev/null | wc -l)
          echo "runtime .js files containing ':9000': ${hits}"
          test "${hits}" -eq 0

      - name: Build app + gateway images
        run: |
          DOCKER_BUILDKIT=1 docker build -f deploy/Dockerfile -t gagent-app:latest \
            --build-arg BASE_IMAGE=python:3.12-slim \
            --build-arg APT_MIRROR_HOST= --build-arg PIP_INDEX_URL=https://pypi.org/simple \
            --build-arg APP_UID=1001 --build-arg APP_GID=1001 .
          DOCKER_BUILDKIT=1 docker build -f deploy/Dockerfile.gateway -t gagent-gateway:latest \
            --build-arg GATEWAY_BASE_IMAGE=nginx:1.29-alpine .

      - name: Check SSE delivery through two nginx hops
        run: python3 deploy/verify-sse-chain.py

      # App image: gate HIGH/CRITICAL that have a fix (findings without an
      # upstream fix are reported but do not fail — base-image properties).
      # trivy is installed by its official script, not a marketplace action:
      # `aquasecurity/trivy-action@0.28.0` failed to resolve on the first run
      # (2026-10-11, run 38136481569 — see LOCAL_INFRA §126).
      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Trivy scan app image
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 gagent-app:latest

      - name: Trivy scan gateway image (report)
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 gagent-gateway:latest

      # The gateway is a third-party nginx base; its 44 HIGHs (measured
      # 2026-10-11, run 38137518643, 0 CRITICAL) are alpine package lag with
      # fixes pending an upstream rebuild — not patchable from this repo
      # (production's base is the byoryn-maintained image and the .8 build is
      # offline, so an `apk upgrade` layer would break production builds).
      # Gate CRITICAL-only here; the HIGHs stay visible in the report step so
      # a change in that picture is still noticed.
      - name: Trivy scan gateway image (gate CRITICAL)
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 gagent-gateway:latest

      - name: Prepare CI .env and host dirs
        run: |
          mkdir -p ci-runtime ci-backups ci-refdata
          chmod 777 ci-runtime ci-backups ci-refdata
          cat > deploy/.env <<EOF
          GAGENT_TAG=latest
          GATEWAY_PORT=18080
          GAGENT_RUNTIME_DIR=${GITHUB_WORKSPACE}/ci-runtime
          GAGENT_BACKUP_DIR=${GITHUB_WORKSPACE}/ci-backups
          GAGENT_REFDATA_DIR=${GITHUB_WORKSPACE}/ci-refdata
          APP_UID=1001
          APP_GID=1001
          APP_ENV=production
          AUTH_MODE=local
          # The production profile is fail-closed: platform_profile() demands a
          # validated public HTTPS LLM endpoint at import time (measured: run
          # 38138301091 died with "PLATFORM_LLM_API_URL must be an absolute
          # HTTP(S) URL"). These dummy values are never contacted — the smoke
          # makes no LLM calls — and example.com resolves to public addresses
          # from the runner, satisfying the DNS/allowlist checks.
          PLATFORM_LLM_API_URL=https://example.com/v1/chat/completions
          PLATFORM_LLM_API_KEY=ci-dummy
          PLATFORM_LLM_MODEL=ci-dummy
          PLATFORM_LLM_ALLOWED_HOSTS=example.com
          CORS_ORIGINS=http://127.0.0.1:18080
          LOG_LEVEL=INFO
          CODE_MODE_ENABLED=1
          CODE_MODE_SANDBOX=1
          CODE_MODE_RPC_BIND=0.0.0.0
          CODE_MODE_RPC_ADVERTISE=app
          SANDBOX_PYTHON_IMAGE=python:3.12-slim
          COMPOSE_PROFILES=
          EOF

      # This transport/filesystem probe uses only stdlib. The independent
      # sandbox-image job still builds/scans the full scientific image.
      - name: Fetch stdlib sandbox fixture for the task runtime smoke
        run: docker pull python:3.12-slim

      - name: Boot the stack
        run: docker compose -f deploy/docker-compose.yml up -d --no-build

      - name: Wait for readiness through the gateway
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:18080/health/ready" >/dev/null 2>&1; then
              echo "stack ready after ~$((i*3))s"
              exit 0
            fi
            sleep 3
          done
          docker compose -f deploy/docker-compose.yml ps
          docker compose -f deploy/docker-compose.yml logs --tail=80 app
          exit 1

      - name: Stack verification (deploy/p1-verify.sh, the §8.2 checklist)
        run: ./deploy/p1-verify.sh 18080

      - name: gagentctl smoke
        run: ./deploy/gagentctl smoke

      - name: Task filesystem and callback terminal round-trip (no model calls)
        run: docker compose -f deploy/docker-compose.yml exec -T -u 1001:1001 app python - < deploy/verify-task-runtime.py

      - name: Ops service smoke (P4 - retention dry-run + backup + list)
        run: |
          docker compose -f deploy/docker-compose.yml exec -T ops python -m app.ops.retention
          docker compose -f deploy/docker-compose.yml run --rm -T --no-deps ops python -m app.ops.backup
          docker compose -f deploy/docker-compose.yml run --rm -T --no-deps ops python -m app.ops.backup --list

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=120 || true

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v || true

  # The third image (deploy/Dockerfile.sandbox). Not needed to boot the stack,
  # so it gets its own job and its own disk. Trivy is report-only here: the
  # image is a deliberately pinned scientific environment (numpy 1.26 /
  # scanpy / pysam / samtools ...) where "fixable HIGH" findings cannot be
  # bumped without breaking the pins — a hard gate would be noise, not safety.
  sandbox-image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Build sandbox image
        run: |
          DOCKER_BUILDKIT=1 docker build -f deploy/Dockerfile.sandbox \
            -t gagent-sandbox-python:latest \
            --build-arg BASE_IMAGE=python:3.12-slim .

      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Trivy scan sandbox image (report only)
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 gagent-sandbox-python:latest
