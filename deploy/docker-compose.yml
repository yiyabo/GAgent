# GAgent stack — portable, single-host compose (LOCAL_INFRA §120+).
#
#   gateway   nginx + built web-ui: the ONLY published entrypoint
#   app       FastAPI backend, internal network only, no docker.sock
#   proxy     docker-socket-proxy: the app's only path to the Docker API
#   redis     (profile "ha") realtime bus for multi-replica — single replica
#             by default: the in-memory bus and the qwen/kernel singletons
#             assume one app process.
#
# Added in later phases (not yet defined here, so `up` works today):
#   P3  sandbox images + egress-proxy (sandbox containers are created on demand
#       by the app through `proxy`, never declared as services)
#   P4  ops (retention GC / SQLite backup cron)
#
# One command on a fresh machine:  cp deploy/.env.template .env  &&  ./deploy/gagentctl up

name: gagent

services:
  gateway:
    image: gagent-gateway:${GAGENT_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
      args:
        # nginx provenance only: the SPA is prebuilt outside the image and this
        # host cannot pull node (see deploy/Dockerfile.gateway).
        GATEWAY_BASE_IMAGE: ${GATEWAY_BASE_IMAGE:-docker.byoryn.cn/ms/webui:ms}
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-40003}:80"
    depends_on:
      app:
        condition: service_healthy
    networks: [front]
    logging: &logging
      driver: json-file
      options: {max-size: "50m", max-file: "10"}

  app:
    image: gagent-app:${GAGENT_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BASE_IMAGE: ${APP_BASE_IMAGE:-python:3.12-slim}
        APP_UID: ${APP_UID:-1001}
        APP_GID: ${APP_GID:-1001}
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-only overrides; everything else comes from .env.
      APP_RUNTIME_ROOT: /app/runtime
      DB_ROOT: /app/data/databases
      # Host path of the runtime bind, for sibling sandbox mounts (DooD).
      HOST_RUNTIME_ROOT: ${GAGENT_RUNTIME_DIR}
      # All Docker access goes through the socket proxy, never a raw socket.
      DOCKER_HOST: tcp://proxy:2375
      # The daemon here is Docker 20.10 (API 1.41) while the image's docker CLI is
      # far newer; without pinning, every CLI call fails with "client version 1.52
      # is too new" — the same mismatch that breaks `docker compose build`.
      DOCKER_API_VERSION: "1.41"
      SERVE_SPA: "0"          # the gateway owns the frontend
      TERMINAL_ENABLED: "0"   # stays off until the P3 sandbox exists
      APP_ENV: ${APP_ENV:-production}
    volumes:
      - ${GAGENT_RUNTIME_DIR}:/app/runtime
      - gagent-data:/app/data
      # Read-only reference data, at the SAME container path the old container
      # used. Three things resolve under /data and would silently break without
      # it: the file_operations allowlist (FILE_OPERATIONS_ALLOWED_BASE_PATHS),
      # the CJK font candidate (tool_box/figure_style.py) and any /data-based
      # reference corpora. The old container had this exact read-only mount, so
      # keeping it preserves behaviour rather than adding capability.
      - ${GAGENT_REFDATA_DIR:-/data}:/data:ro
    extra_hosts:
      # Host services the app must reach: LLM gateway (sub2api), platform API,
      # and the host-side SOCKS/HTTP egress tunnels.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/health/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [front, sandbox]
    logging: *logging

  proxy:
    # Our own allowlisted Docker API proxy, not a community image: this host
    # cannot pull one (see app/ops/docker_proxy.py). Same image as the app,
    # different entrypoint.
    image: gagent-app:${GAGENT_TAG:-latest}
    command: ["python", "-m", "app.ops.docker_proxy"]
    restart: unless-stopped
    # The daemon socket is root-group-owned on typical hosts, so the process that
    # opens it must be root; the allowlist is the control, not the uid. (The app
    # image defaults to uid 1001 and would get EACCES on the socket.)
    user: "0:0"
    environment:
      DOCKER_PROXY_SOCKET: /var/run/docker.sock
      DOCKER_PROXY_PORT: "2375"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # The daemon socket is mounted into THIS container only, never the app's.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:2375/_ping', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks: [sandbox]
    logging: *logging

  forwarder:
    # Runs in the HOST network namespace so 127.0.0.1 is the host's loopback, and
    # re-publishes the host's loopback-only tunnels on the bridge gateway. The
    # old container could reach them because it used host networking; a bridge
    # container cannot (measured: ConnectionRefusedError). See
    # app/ops/port_forward.py. No host config change, no extra image.
    image: gagent-app:${GAGENT_TAG:-latest}
    command: ["python", "-m", "app.ops.port_forward"]
    restart: unless-stopped
    network_mode: host
    environment:
      FORWARD_SPECS: ${FORWARD_SPECS:-11080:127.0.0.1:1080,17890:127.0.0.1:7890}
      # Explicit addresses only: never bind the host's LAN interfaces.
      FORWARD_BIND: ${FORWARD_BIND:-172.17.0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    read_only: true
    tmpfs:
      - /tmp
    logging: *logging

  redis:
    image: redis:7-alpine
    profiles: ["ha"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [front]
    logging: *logging

volumes:
  gagent-data:
    name: gagent-data

networks:
  # Explicit subnets: the forwarder must bind the exact gateway address that
  # `host.docker.internal` resolves to inside the app container, so the address
  # cannot be left to the daemon's allocation pool.
  front:
    name: gagent-front
    internal: false   # the gateway is published here
    ipam:
      config:
        - subnet: 172.28.0.0/24
  sandbox:
    name: gagent-sandbox
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
