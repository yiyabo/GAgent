# GAgent stack — portable, single-host compose (LOCAL_INFRA §120+).
#
#   gateway   nginx + built web-ui: the ONLY published entrypoint
#   app       FastAPI backend, internal network only, no docker.sock
#   proxy     docker-socket-proxy: the app's only path to the Docker API
#   redis     (profile "ha") realtime bus for multi-replica — single replica
#             by default: the in-memory bus and the qwen/kernel singletons
#             assume one app process.
#
# Added in later phases (not yet defined here, so `up` works today):
#   P3  sandbox images + egress-proxy (sandbox containers are created on demand
#       by the app through `proxy`, never declared as services)
#   P4  ops (retention GC / SQLite backup cron)
#
# One command on a fresh machine:  cp deploy/.env.template .env  &&  ./deploy/gagentctl up

name: gagent

services:
  gateway:
    image: gagent-gateway:${GAGENT_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
      args:
        # nginx provenance only: the SPA is prebuilt outside the image and this
        # host cannot pull node (see deploy/Dockerfile.gateway).
        GATEWAY_BASE_IMAGE: ${GATEWAY_BASE_IMAGE:-docker.byoryn.cn/ms/webui:ms}
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-40003}:80"
    depends_on:
      app:
        condition: service_healthy
    networks: [front]
    logging: &logging
      driver: json-file
      options: {max-size: "50m", max-file: "10"}

  app:
    image: gagent-app:${GAGENT_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BASE_IMAGE: ${APP_BASE_IMAGE:-python:3.12-slim}
        APP_UID: ${APP_UID:-1001}
        APP_GID: ${APP_GID:-1001}
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-only overrides; everything else comes from .env.
      APP_RUNTIME_ROOT: /app/runtime
      DB_ROOT: /app/data/databases
      # Host path of the runtime bind, for sibling sandbox mounts (DooD).
      HOST_RUNTIME_ROOT: ${GAGENT_RUNTIME_DIR}
      # All Docker access goes through the socket proxy, never a raw socket.
      DOCKER_HOST: tcp://proxy:2375
      SERVE_SPA: "0"          # the gateway owns the frontend
      TERMINAL_ENABLED: "0"   # stays off until the P3 sandbox exists
      APP_ENV: ${APP_ENV:-production}
    volumes:
      - ${GAGENT_RUNTIME_DIR}:/app/runtime
      - gagent-data:/app/data
    extra_hosts:
      # Host services the app must reach: LLM gateway (sub2api), platform API,
      # and the host-side SOCKS/HTTP egress tunnels.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/health/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [front, sandbox]
    logging: *logging

  proxy:
    # Our own allowlisted Docker API proxy, not a community image: this host
    # cannot pull one (see app/ops/docker_proxy.py). Same image as the app,
    # different entrypoint.
    image: gagent-app:${GAGENT_TAG:-latest}
    command: ["python", "-m", "app.ops.docker_proxy"]
    restart: unless-stopped
    environment:
      DOCKER_PROXY_SOCKET: /var/run/docker.sock
      DOCKER_PROXY_PORT: "2375"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # The daemon socket is mounted into THIS container only, never the app's.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:2375/_ping', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks: [sandbox]
    logging: *logging

  redis:
    image: redis:7-alpine
    profiles: ["ha"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [front]
    logging: *logging

volumes:
  gagent-data:
    name: gagent-data

networks:
  front:
    name: gagent-front
    internal: false   # the gateway is published here
  sandbox:
    name: gagent-sandbox
    internal: true
