# GAgent ingress (LOCAL_INFRA §120+). The ONLY published entrypoint: serves the
# built web-ui, reverse-proxies the API to the app, and terminates WebSockets.
# The app itself listens on the internal network only.
#
# Design notes
# - Path allowlist, not a catch-all: an unknown /api-ish path 404s here instead
#   of silently reaching the app (the app's own SPA catch-all is disabled with
#   SERVE_SPA=0 in the stack).
# - WebSocket upgrade is only offered on /ws/ and is authenticated by the app
#   (the middleware rejects anonymous handshakes); nginx just forwards cookies.
# - Rate limits guard the credential endpoints; bodies are capped.

upstream gagent_app {
    server app:9000;
    keepalive 32;
}

# $connection_upgrade is "upgrade" only when the client asked for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=gagent_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gagent_api:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Uploads can be large; must be >= UPLOAD_MAX_BYTES.
    client_max_body_size 2048m;
    client_body_timeout 300s;

    # Long-lived streams (chat SSE, plan job streams) must not be cut early.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- built frontend ----
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- credential endpoints: strict rate limit, no caching ----
    location ~ ^/(auth|sso)/ {
        limit_req zone=gagent_auth burst=20 nodelay;
        proxy_pass http://gagent_app;
        include /etc/nginx/gagent_proxy_common.conf;
    }

    # ---- WebSocket (terminal and any future WS surface) ----
    location /ws/ {
        proxy_pass http://gagent_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- API surface (explicit allowlist) ----
    location ~ ^/(api|chat|plans|jobs|tasks|upload|artifacts|project|execution|interpreter|system|quality|terminal|models|tools|usage|skill-learning|mcp)(/|$) {
        limit_req zone=gagent_api burst=120 nodelay;
        proxy_pass http://gagent_app;
        include /etc/nginx/gagent_proxy_common.conf;
    }

    location = /health        { proxy_pass http://gagent_app; include /etc/nginx/gagent_proxy_common.conf; }
    location = /health/ready  { proxy_pass http://gagent_app; include /etc/nginx/gagent_proxy_common.conf; }
    location = /health/llm    { proxy_pass http://gagent_app; include /etc/nginx/gagent_proxy_common.conf; }
    location = /openapi.json  { return 404; }
    location /docs            { return 404; }

    # ---- SPA fallback for client-side routes ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
