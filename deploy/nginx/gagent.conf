# GAgent ingress (LOCAL_INFRA §120+). The ONLY published entrypoint: serves the
# built web-ui, reverse-proxies the API to the app, and terminates WebSockets.
# The app itself listens on the internal network only.
#
# Design notes
# - Path allowlist, not a catch-all: an unknown /api-ish path 404s here instead
#   of silently reaching the app (the app's own SPA catch-all is disabled with
#   SERVE_SPA=0 in the stack).
# - WebSocket upgrade is only offered on /ws/ and is authenticated by the app
#   (the middleware rejects anonymous handshakes); nginx just forwards cookies.
# - Rate limits guard the credential endpoints; bodies are capped.

# NOTE ON THE UPSTREAM
# The app is addressed through the variable $gagent_app (set in the server
# block) with Docker's embedded resolver, NOT through an `upstream` block. nginx
# resolves `upstream` server names at config-test/startup time, which fails the
# image build ("host not found in upstream app:9000") because the app container
# does not exist yet — and it would also break if the app is recreated with a new
# IP. A variable defers resolution to request time, which is the documented
# nginx-in-Docker pattern. Do not "simplify" this back into an upstream block.

# $connection_upgrade is "upgrade" only when the client asked for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=gagent_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gagent_api:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # The public entrypoint is the host's Apache, which reaches this container through Docker's bridge, so
    # every request arrives from the bridge gateway (the `front` network's .1 in docker-compose.yml). Take the
    # client address from X-Forwarded-For, but only when the connection comes from that gateway; a connection
    # from anywhere else cannot choose its own address. Without this the per-address rate limits below are
    # one shared bucket for all users.
    set_real_ip_from 172.28.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's embedded DNS on a user-defined network; short TTL so a recreated
    # app container is picked up without reloading nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gagent_app "app:9000";

    # Uploads can be large; must be >= UPLOAD_MAX_BYTES.
    client_max_body_size 2048m;
    client_body_timeout 300s;

    # Long-lived streams (chat SSE, plan job streams) must not be cut early.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- built frontend ----
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- credential endpoints: strict rate limit, no caching ----
    location ~ ^/(auth|sso)/ {
        limit_req zone=gagent_auth burst=20 nodelay;
        proxy_pass http://$gagent_app;
        include /etc/nginx/gagent_proxy_common.conf;
    }

    # ---- WebSocket (terminal and any future WS surface) ----
    location /ws/ {
        proxy_pass http://$gagent_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- SPA page routes that collide with the API allowlist ----
    # MUST precede the API regex below: nginx picks the first matching regex
    # location, and the API regex's `(/|$)` alternative also matches the bare
    # prefix — so a browser refresh on a client-side page route such as /chat
    # was proxied to the app and answered with its API 404 envelope (measured
    # 2026-10-12; the platform's entry link deep-links to /chat). These five are
    # the App.tsx routes that collide (chat/tasks/plans/system/extensions); the other page
    # routes (/, /login, /register, /dashboard, /memory, /analytics) fall
    # through to the SPA fallback below. When App.tsx grows a route that
    # collides with the API allowlist, add it here too.
    location ~ ^/(chat|tasks|plans|system|extensions)/?$ {
        try_files $uri /index.html;
    }

    # ---- API surface (explicit allowlist) ----
    location ~ ^/(api|chat|plans|jobs|tasks|upload|artifacts|project|execution|interpreter|system|quality|terminal|models|tools|usage|skill-learning|mcp|extensions)(/|$) {
        limit_req zone=gagent_api burst=120 nodelay;
        proxy_pass http://$gagent_app;
        include /etc/nginx/gagent_proxy_common.conf;
    }

    location = /health        { proxy_pass http://$gagent_app; include /etc/nginx/gagent_proxy_common.conf; }
    location = /health/ready  { proxy_pass http://$gagent_app; include /etc/nginx/gagent_proxy_common.conf; }
    location = /health/llm    { proxy_pass http://$gagent_app; include /etc/nginx/gagent_proxy_common.conf; }
    location = /openapi.json  { return 404; }
    location /docs            { return 404; }

    # ---- SPA fallback for client-side routes ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
