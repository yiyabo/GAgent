# Shared proxy headers for every location that forwards to the app.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_set_header Connection "";
# nginx consumes X-Accel-* upstream headers by default. Preserve the app's
# per-response SSE directive for the public nginx in front of this gateway;
# otherwise that outer hop buffers small events despite our buffering=off.
proxy_pass_header X-Accel-Buffering;
