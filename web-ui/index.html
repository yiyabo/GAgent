<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAgent · 研究工作台</title>
    <meta name="description" content="GAgent 科研工作台：研究对话、计划执行与可追溯产物。" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Set the colour scheme before first paint so dark-mode users never see a white flash.
      // Keep in step with src/theme/themeMode.ts (storage key gagent.theme; values light | dark | system).
      (function () {
        try {
          var pref = localStorage.getItem('gagent.theme');
          var dark = pref === 'dark' || ((pref === null || pref === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
